name: 每日刷新并部署

on:
  schedule:
    # 3:00 AM 北京时间 = 19:00 UTC 前一天
    - cron: '0 19 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 抓取数据并生成页面
        run: python -u fetch_data.py

      - name: 准备 Pages 产物
        run: |
          mkdir -p site
          cp index.html site/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
